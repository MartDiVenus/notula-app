<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e293b" />
      <stop offset="50%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>
    <linearGradient id="tabulaStoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#3b82f6" stopOpacity="0.28" />
      <stop offset="100%" stopColor="#1d4ed8" stopOpacity="0.08" />
    </linearGradient>
    <linearGradient id="birdWingGradLeft" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#1d4ed8" />
      <stop offset="50%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#e0f2fe" />
    </linearGradient>
    <linearGradient id="birdWingGradRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#1d4ed8" />
      <stop offset="50%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#e0f2fe" />
    </linearGradient>
    <radialGradient id="goldStarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="50%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#b45309" />
    </radialGradient>
  </defs>

  <!-- Dark Rounded App Canvas -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />
  <rect width="98" height="98" x="1" y="1" rx="21" stroke="#3b82f6" strokeWidth="1.2" strokeOpacity="0.4" />

  <!-- 1. TAVOLETTA DEI FASTI ROMANI (Tabula del Calendario Antico) -->
  <rect 
    x="13" 
    y="9" 
    width="74" 
    height="82" 
    rx="9" 
    fill="url(#tabulaStoneGrad)" 
    stroke="#60a5fa" 
    strokeWidth="2.2" 
    strokeOpacity="0.75" 
  />

  <!-- Scanalature araldiche della pietra del calendario -->
  <line x1="20" y1="18" x2="36" y2="18" stroke="#93c5fd" strokeWidth="1.5" strokeOpacity="0.45" strokeLinecap="round" />
  <line x1="64" y1="18" x2="80" y2="18" stroke="#93c5fd" strokeWidth="1.5" strokeOpacity="0.45" strokeLinecap="round" />
  <line x1="20" y1="84" x2="80" y2="84" stroke="#93c5fd" strokeWidth="1.5" strokeOpacity="0.45" strokeLinecap="round" />

  <!-- 2. LE STELLE DI ORIENTAMENTO ASTRONOMICO -->
  <path 
    d="M50 12 L51.8 17.5 L57.5 19 L51.8 20.5 L50 26 L48.2 20.5 L42.5 19 L48.2 17.5 Z" 
    fill="url(#goldStarGlow)" 
  />
  <circle cx="23" cy="27" r="1.5" fill="#fef08a" opacity="0.9" />
  <circle cx="77" cy="27" r="1.5" fill="#fef08a" opacity="0.9" />

  <!-- 3. UCCELLO MESSAGGERO DI APOLLO: 2 SOLE ALI SPIEGATE AD ARCO -->
  <path 
    d="M50 48 C42 41, 30 33, 17 38 C23 48, 32 58, 48 57 Z" 
    fill="url(#birdWingGradLeft)" 
    stroke="#93c5fd" 
    strokeWidth="0.9" 
  />
  <path d="M22 42 C30 46, 38 52, 47 54" stroke="#ffffff" strokeWidth="0.7" strokeOpacity="0.7" strokeLinecap="round" />
  <path d="M28 47 C34 50, 40 54, 46 56" stroke="#ffffff" strokeWidth="0.6" strokeOpacity="0.5" strokeLinecap="round" />

  <path 
    d="M50 48 C58 41, 70 33, 83 38 C77 48, 68 58, 52 57 Z" 
    fill="url(#birdWingGradRight)" 
    stroke="#93c5fd" 
    strokeWidth="0.9" 
  />
  <path d="M78 42 C70 46, 62 52, 53 54" stroke="#ffffff" strokeWidth="0.7" strokeOpacity="0.7" strokeLinecap="round" />
  <path d="M72 47 C66 50, 60 54, 54 56" stroke="#ffffff" strokeWidth="0.6" strokeOpacity="0.5" strokeLinecap="round" />

  <!-- CORPOcentrale del volatile -->
  <ellipse cx="50" cy="52" rx="4.8" ry="14" fill="#0284c7" stroke="#38bdf8" strokeWidth="0.8" />
  <ellipse cx="50" cy="53" rx="2.5" ry="9" fill="#e0f2fe" opacity="0.95" />

  <!-- TESTA E COLLO -->
  <circle cx="50" cy="33" r="5" fill="#e0f2fe" stroke="#38bdf8" strokeWidth="0.7" />

  <!-- BECCO DORATO ACUMINATO DA RAPACE -->
  <path 
    d="M50 24 L46.5 32 L53.5 32 Z" 
    fill="url(#goldStarGlow)" 
    stroke="#b45309" 
    strokeWidth="0.5" 
  />

  <!-- OCCHI -->
  <circle cx="48.2" cy="33.5" r="1.1" fill="#0f172a" />
  <circle cx="48.5" cy="33.2" r="0.4" fill="#ffffff" />
  <circle cx="51.8" cy="33.5" r="1.1" fill="#0f172a" />
  <circle cx="51.5" cy="33.2" r="0.4" fill="#ffffff" />

  <!-- CODA PIUMATA A VENTAGLIO -->
  <path 
    d="M48 67 L42 77 L47 75 L50 78 L53 75 L58 77 L52 67 Z" 
    fill="#1d4ed8" 
    stroke="#60a5fa" 
    strokeWidth="0.8" 
  />
</svg>
