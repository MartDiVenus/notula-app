name: Compilazione Desktop Multipiattaforma (Notula)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: Notula-Windows
          - os: ubuntu-latest
            artifact-name: Notula-Linux
          - os: macos-latest
            artifact-name: Notula-MacOS

    runs-on: ${{ matrix.os }}

    steps:
      - name: 📥 Checkout Codice Sorgente
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🐧 Installazione Strumenti di Sistema Linux (per .deb / AppImage)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -y && sudo apt-get install -y binutils

      - name: 📦 Installazione Dipendenze del Progetto
        run: npm install --no-audit --no-fund

      - name: 📦 Installazione Strumenti di Compilazione Desktop
        run: npm install -D electron electron-builder

      - name: 🔨 Compilazione Web (Vite Build)
        run: |
          node scripts/generate-icons.js
          npm run build

      - name: 🚀 Packaging Eseguibili Desktop (Electron Builder)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish never

      - name: 💾 Archiviazione Artefatti per il Download (ZIP / Installer)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist_electron/*.exe
            dist_electron/*.AppImage
            dist_electron/*.deb
            dist_electron/*.dmg
            dist_electron/*.zip
          if-no-files-found: warn
